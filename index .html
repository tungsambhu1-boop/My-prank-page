<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Secret 😏</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      font-family: Arial, sans-serif;
    }

    .box {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 30px 22px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: #25D366;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #result {
      display: none;
      margin-top: 25px;
      font-size: 22px;
      font-weight: bold;
      color: #e91e63;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>😏 Secret Message</h1>

    <p>তোমার নামটা লিখো 👇</p>

    <input
      type="text"
      id="name"
      placeholder="তোমার নাম"
    >

    <button onclick="showResult()">
      দেখো 😈
    </button>

    <div id="result"></div>

  </div>


  <script>
    function showResult() {

      let name = document.getElementById("name").value.trim();

      if (name === "") {
        alert("আগে তোমার নাম লেখো 😄");
        return;
      }

      document.getElementById("result").style.display = "block";

      document.getElementById("result").innerHTML =
        "😂 " + name + ", তোর girlfriend হলো<br><br>" +
        "❤️ Ranu Mondol ❤️";
    }
  </script>

</body>
</html>
